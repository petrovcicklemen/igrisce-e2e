# GitHub Actions workflow: runs the Playwright tests against Matematično igrišče.
# Every file in .github/workflows/ is a workflow. GitHub reads it on every push.
name: E2E tests

# WHEN to run
on:
  push:                    # every push to main
    branches: [main]
  pull_request:            # every pull request
  schedule:                # nightly at 03:17 UTC (cron, always UTC)
    - cron: '17 3 * * *'
  workflow_dispatch:       # "Run workflow" button in the Actions tab
    inputs:
      target:
        description: 'What to test'
        type: choice
        options: [local-copy, live-site]
        default: local-copy
      test_notification:
        description: 'Send a Telegram message even if nothing changed'
        type: boolean
        default: false

# Cancel an older run of the same branch if a newer one starts
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest       # a fresh GitHub-hosted Linux VM (the "runner")
    timeout-minutes: 15

    strategy:
      fail-fast: false           # let both projects finish even if one fails
      matrix:                    # runs this job twice, in parallel, on two runners
        project: [desktop-chrome, tablet]

    env:
      # If started manually with target=live-site, test GitHub Pages instead of a local copy
      BASE_URL: ${{ github.event.inputs.target == 'live-site' && 'https://petrovcicklemen.github.io/igrisce/' || '' }}

    steps:
      - name: Check out the tests (this repo)
        uses: actions/checkout@v4

      - name: Check out the app (petrovcicklemen/igrisce) into ./app
        uses: actions/checkout@v4
        with:
          repository: petrovcicklemen/igrisce
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm             # cache ~/.npm between runs so npm ci is faster

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      # Upload results even when tests fail; download them from the run's Summary page
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.project }}
          path: results/junit.xml
          retention-days: 14

  # Runs after both test jobs, sends a Telegram message on failure or recovery
  notify:
    name: Telegram notification
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read            # to look up the previous run's result
    env:
      # Secrets come in through env, never inline in the script, and are masked in logs.
      # Pull requests from forks do not receive secrets, so they are empty there and we skip.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      RESULT: ${{ needs.test.result }}
      FORCE: ${{ github.event.inputs.test_notification }}
    steps:
      - name: Decide whether to notify
        id: decide
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not available, skipping."; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Result of the previous completed run of this workflow on the same branch
          PREV=$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --branch "$GITHUB_REF_NAME" \
                 --status completed --limit 1 --json conclusion -q '.[0].conclusion' || true)
          echo "This run: $RESULT, previous run: ${PREV:-none}"
          if [ "$RESULT" = "failure" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"; echo "icon=❌" >> "$GITHUB_OUTPUT"; echo "text=E2E tests FAILED" >> "$GITHUB_OUTPUT"
          elif [ "$RESULT" = "success" ] && [ "$PREV" = "failure" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"; echo "icon=✅" >> "$GITHUB_OUTPUT"; echo "text=E2E tests are green again" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"; echo "icon=🔔" >> "$GITHUB_OUTPUT"; echo "text=Test notification, result: $RESULT" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to report."; echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram message
        if: ${{ steps.decide.outputs.send == 'true' }}
        env:
          ICON: ${{ steps.decide.outputs.icon }}
          TEXT: ${{ steps.decide.outputs.text }}
        run: |
          MESSAGE="$ICON $TEXT
          Repo: $GITHUB_REPOSITORY ($GITHUB_REF_NAME, ${GITHUB_SHA::7})
          Trigger: $GITHUB_EVENT_NAME
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS --fail-with-body -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"
          echo "Message sent."

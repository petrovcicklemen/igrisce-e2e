# GitHub Actions workflow: runs the Playwright tests against Matematično igrišče.
# Every file in .github/workflows/ is a workflow. GitHub reads it on every push.
name: E2E tests

# WHEN to run
on:
  push:                    # every push to main
    branches: [main]
  pull_request:            # every pull request
  schedule:                # nightly at 03:17 UTC (cron, always UTC)
    - cron: '17 3 * * *'
  workflow_dispatch:       # "Run workflow" button in the Actions tab
    inputs:
      target:
        description: 'What to test'
        type: choice
        options: [local-copy, live-site]
        default: local-copy

# Cancel an older run of the same branch if a newer one starts
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest       # a fresh GitHub-hosted Linux VM (the "runner")
    timeout-minutes: 15

    strategy:
      fail-fast: false           # let both projects finish even if one fails
      matrix:                    # runs this job twice, in parallel, on two runners
        project: [desktop-chrome, tablet]

    env:
      # If started manually with target=live-site, test GitHub Pages instead of a local copy
      BASE_URL: ${{ github.event.inputs.target == 'live-site' && 'https://petrovcicklemen.github.io/igrisce/' || '' }}

    steps:
      - name: Check out the tests (this repo)
        uses: actions/checkout@v4

      - name: Check out the app (petrovcicklemen/igrisce) into ./app
        uses: actions/checkout@v4
        with:
          repository: petrovcicklemen/igrisce
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm             # cache ~/.npm between runs so npm ci is faster

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      # Upload results even when tests fail; download them from the run's Summary page
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.project }}
          path: results/junit.xml
          retention-days: 14
